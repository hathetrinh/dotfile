import = [
    "~/.config/alacritty/themes/themes/gruvbox_dark.toml",
]

live_config_reload = true

[cursor]
style.shape = "Block"
style.blinking = "Always"
vi_mode_style = "Underline"

[env]
TERM = "xterm-256color"

[font]
size = 20
#use_thin_strokes = false

[font.bold]
family = "ComicShannsMono Nerd Font"
style = "Bold"

#[font.debug]
#persistent_logging = false

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "ComicShannsMono Nerd Font"
style = "Italic"

[font.normal]
#family = "Hack Nerd Font Mono"
family = "ComicShannsMono Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 0

[scrolling]
history = 100000
multiplier = 3

[shell]
args = ["-l", "-c", "tmux attach || tmux"]
program = "/usr/local/bin/zsh"

[window]
decorations = "None"
dynamic_title = true
padding = { x = 3, y = 3 }
opacity = 0.9
